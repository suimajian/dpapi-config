[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpapi-config"
version = "1.0.0"
description = "Encrypt selected fields of a JSON config file with Windows DPAPI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "suimajian" }]
keywords = ["dpapi", "windows", "config", "secrets", "encryption"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/suimajian/dpapi-config"

[tool.setuptools]
packages = ["dpapi_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
